name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        pip install . --group dev
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tests/vite-fixtures/*/package-lock.json
    - name: Build Vite fixtures
      run: |
        for d in tests/vite-fixtures/*/; do (cd "$d" && npm ci && npm run build); done
    - name: Install Playwright browsers
      if: matrix.python-version == '3.12'
      run: python -m playwright install --with-deps chromium
    - name: Run tests
      if: matrix.python-version == '3.12'
      run: |
        python -m pytest
    - name: Run tests (not browser)
      if: matrix.python-version != '3.12'
      run: |
        python -m pytest -m "not browser"

